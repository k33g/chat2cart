<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - AI Shopping Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🛒 chat2cart</h1>
            <p>AI-powered shopping assistant</p>
        </header>

        <div class="main-content">
            <!-- Single Input Section -->
            <div class="input-section">
                <div class="chat-input-container">
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Type your message here..." autocomplete="off">
                        <button id="sendButton" type="button">
                            <span>Send</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="chat-section">
                <!-- Non-Streaming Chat -->
                <div class="chat-panel">
                    <div class="chat-header">
                        <h2>AI Shopping Assistant</h2>
                        <div class="performance-metrics">
                            <span class="status" id="nonStreamingStatus">Ready</span>
                        </div>
                    </div>
                    <div class="chat-container">
                        <div class="chat-messages" id="nonStreamingMessages">
                            <div class="message assistant">
                                <div class="message-content">
                                    <p>👋 Hello! I'm your AI shopping assistant.</p>
                                    <p>How can I help you today?</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-container">
                    <div class="cart-header">
                        <h2>🛒 Your Cart</h2>
                        <span class="cart-count" id="cartCount">0 items</span>
                    </div>
                    
                    <div class="cart-items" id="cartItems">
                        <div class="empty-cart">
                            <p>Your cart is empty</p>
                            <p class="empty-cart-subtitle">Start chatting to add items!</p>
                        </div>
                    </div>
                    
                    <div class="cart-summary" id="cartSummary" style="display: none;">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax:</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="total">$0.00</span>
                        </div>
                        <button class="checkout-btn" id="checkoutBtn">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading indicator -->
    <div class="loading-indicator" id="loadingIndicator" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
